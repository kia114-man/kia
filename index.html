<style>
:root{

  --navy:#05141f; --accent:#0a6cff; --green:#0f9d58; --red:#e5484d; --amber:#f5a524;
  --now:#0f9d58; --sale:#0a6cff; --pre:#d98a00;

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}

.tab.on[data-k=sale]{box-shadow:inset 0 -3px 0 var(--sale)}
.tab.on[data-k=pre]{box-shadow:inset 0 -3px 0 var(--pre)}
.tab.on[data-k=all]{box-shadow:inset 0 -3px 0 #8b5cf6}

.src{flex:none;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;color:#fff}
.src.now{background:var(--now)}.src.sale{background:var(--sale)}.src.pre{background:var(--pre)}
.bar{background:#fff;border-bottom:1px solid var(--line)}

.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding-bottom:8px}

.chip{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:5px 2px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap;line-height:1.2;text-align:center;overflow:hidden;text-overflow:ellipsis}
.chip em{display:block;font-style:normal;font-weight:500;color:var(--ink3);font-size:11px}
.totop{position:fixed;right:14px;bottom:18px;z-index:30;width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;display:none}
.totop.show{display:block}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on em{color:#9fb0c0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-bottom:10px}

.filters select{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:9px;padding:7px 8px;font-size:13px;background:#fff;color:var(--ink2)}
.nbtn{display:flex;align-items:center;justify-content:space-between;width:100%;margin:10px 0 0;border:1.5px solid #cfe0ff;background:#eef4ff;color:#0b3a8c;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:800;cursor:pointer}
.nbtn small{font-size:12px;font-weight:600;color:#4a6aa8}
.nwrap{position:fixed;inset:0;background:rgba(5,20,31,.55);display:none;z-index:45;align-items:flex-end;justify-content:center}
.nwrap.show{display:flex}
.nsheet{background:#fff;width:100%;max-width:640px;height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.nhead{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.nhead .t{display:flex;justify-content:space-between;align-items:center}
.nhead h3{font-size:17px;font-weight:800}
.nhead .x{border:0;background:#eef2f6;border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer;color:var(--ink2)}
.nhead p{font-size:12px;color:var(--ink3);margin-top:4px}
.nhead input{width:100%;margin-top:10px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;background:#f8fafc;outline:none}
.nbody{overflow-y:auto;padding:8px 16px 30px;-webkit-overflow-scrolling:touch}
.ncommon{background:#fff8e6;border:1px solid #f3d38a;border-radius:10px;padding:10px 12px;margin:8px 0 4px;font-size:12.5px;line-height:1.6;color:#5a4300}
.ncommon li{margin-left:16px}
.ngrp{font-size:13px;font-weight:800;color:#fff;background:var(--navy);border-radius:8px;padding:6px 10px;margin:16px 0 6px}

.nrow .m{font-size:15px;font-weight:800}
.nrow .k{font-size:12.5px;color:var(--ink2);margin-top:1px}
.nrow .n{font-size:12px;color:#b4232a;margin-top:3px;line-height:1.45}
.nrow .d{flex:none;font-size:16px;font-weight:800;color:#0a6cff;background:#eef4ff;border-radius:8px;padding:4px 10px;white-space:nowrap}
.ngnote{font-size:12px;color:var(--ink2);background:#f4f6f9;border-radius:8px;padding:8px 10px;margin-top:6px;line-height:1.5}
.notice{margin:8px 0 0;border:1.5px solid #ffd9a8;background:#fff8ef;border-radius:10px;overflow:hidden}
.notice .nh{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-size:14px;font-weight:800;color:#8a4b00;cursor:pointer}

.notice .ni{border-top:1px dashed #ffd9a8;padding:9px 12px}

.notice.fold .ni.old{display:none}
.npop{position:fixed;inset:0;background:rgba(5,20,31,.6);display:none;z-index:60;align-items:center;justify-content:center;padding:20px}
.npop.show{display:flex}
.npbox{background:#fff;width:100%;max-width:420px;max-height:80vh;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.nphd{background:#05141f;color:#fff;padding:14px 16px;font-size:16px;font-weight:800}
.npbd{overflow-y:auto;padding:4px 16px 8px}
.npit{padding:12px 0;border-bottom:1px dashed var(--line)}
.npit:last-child{border-bottom:0}
.npit .tt{display:flex;gap:6px;align-items:baseline;font-size:15px;font-weight:800}
.npit .tt .pin{font-size:11px;font-weight:800;color:#fff;background:#e5484d;border-radius:5px;padding:1px 5px;flex:none}
.npit .tt .dt{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink3);flex:none}
.npit .bd{font-size:14px;color:#33414f;line-height:1.6;margin-top:5px;white-space:pre-line}
.npft{display:flex;border-top:1px solid var(--line)}
.npft button{flex:1;border:0;background:#fff;padding:14px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink2)}
.npft button+button{border-left:1px solid var(--line);color:#05141f}
.sum{font-size:13px;color:var(--ink2);padding:12px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sum b{color:var(--ink);font-size:15px}
.list{display:grid;gap:10px;padding-bottom:30px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px 12px;display:flex;flex-direction:column;gap:8px}
.r1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.model{font-size:12px;font-weight:800;color:#fff;background:var(--navy);border-radius:6px;padding:2px 7px;flex:none}
.trim{font-size:14.5px;font-weight:700;line-height:1.35;letter-spacing:-.2px;flex:1}
.qty{flex:none;font-size:12px;font-weight:800;color:var(--now);background:#e7f6ee;border-radius:6px;padding:2px 7px}
.cust{display:flex;align-items:center;gap:8px;background:#fff6e0;border:1px solid #f3d38a;border-radius:9px;padding:7px 10px}
.cust span{font-size:12px;font-weight:700;color:#9a6a00}
.cust b{font-size:16px;font-weight:800;color:#0b1b2b}
.opts{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.opts .ol{font-size:12px;font-weight:800;color:#0b3a8c;margin-right:2px}
.opt{font-size:13px;font-weight:700;background:#e8f1ff;color:#0b3a8c;border:1px solid #c9dcff;border-radius:7px;padding:3px 8px}
.opt.none{background:#f1f4f8;border-color:#e3e8ee;color:var(--ink3);font-weight:600}
.colors{display:flex;gap:12px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.colors span{display:inline-flex;align-items:center;gap:5px}
.dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block;flex:none}
.r3{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:9px}
.price{font-size:17px;font-weight:800;letter-spacing:-.3px}
.price small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:2px}
.meta{font-size:11.5px;color:var(--ink3);margin-top:2px}
.disc{display:inline-block;font-size:12px;font-weight:800;color:var(--sale);background:#e8f1ff;border-radius:6px;padding:2px 7px;margin-right:4px}
.st{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px}
.st.ok{color:#fff;background:var(--pre)}
.st.wait{color:var(--ink2);background:#eef2f6}
.ask{flex:none;border:0;background:#fee500;color:#191919;font-weight:700;font-size:13px;border-radius:9px;padding:8px 11px;cursor:pointer}
.ask:active{transform:scale(.97)}
.more{display:block;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-weight:700;color:var(--ink2);cursor:pointer;margin:4px 0 30px}
.empty{text-align:center;color:var(--ink3);padding:50px 10px;font-size:14px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#111;color:#fff;font-size:13.5px;padding:11px 16px;border-radius:12px;transition:.25s;z-index:50;max-width:92vw;text-align:center;line-height:1.5;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(5,20,31,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 20px}
.sheet h3{font-size:15px;margin-bottom:10px}
.sheet textarea{width:100%;height:170px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:13.5px;line-height:1.55;resize:none;font-family:inherit}
.sheet .btns{display:flex;gap:8px;margin-top:10px}
.sheet .btns button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
.b-copy{background:#fee500;color:#191919}
.b-close{background:#eef2f6;color:var(--ink2)}
.hint{font-size:12px;color:var(--ink3);margin-top:8px;line-height:1.5}
.loading{padding:60px 0;text-align:center;color:var(--ink3)}

<header class="top" id="top">
  <div class="wrap">
    <div class="hd">

  </div>
</div>
<div class="nwrap" id="nWrap">

      <div class="t"><h3 id="nTitle">차종별 납기안내</h3><button class="x" id="nClose">닫기</button></div>
      <p id="nBasis"></p>
      <input id="nQ" type="search" placeholder="차종 검색: 예) 카니발, 쏘렌토" autocomplete="off">
    </div>
    <div class="nbody" id="nBody"></div>
  </div>
</div>
<div class="npop" id="npop"><div class="npbox"><div class="nphd">📢 공지사항</div><div class="npbd" id="npbd"></div>

 '블랙':'#1b1b1b','그레이':'#8d8f92','브라운':'#6b4a35','베이지':'#d6c6a8','코튼베이지':'#d9cbb0','네이비':'#1f2b44','차콜':'#3a3b3d',
 '라운지브라운':'#6a4835','미디움그레이':'#7c7f82','미디움 그레이':'#7c7f82','토피 브라운':'#7a5236','올리브브라운':'#5c5038','마롱브라운':'#5a3426',
 '스모키블랙':'#222','휴먼그레이':'#8a8a88','어반그레이':'#7c7f82','마션브라운':'#6a3a28','미스티그레이':'#a9adb0'
};
function colorOf(n){n=(n||'').trim();if(COLOR[n])return COLOR[n];
  for(const k in COLOR){if(n.replace(/\s/g,'').includes(k.replace(/\s/g,'')))return COLOR[k];}
  if(/화이트|백/.test(n))return '#f4f4f2';if(/블랙/.test(n))return '#1b1b1b';if(/그레이/.test(n))return '#888';
  if(/브라운/.test(n))return '#6b4a35';if(/베이지/.test(n))return '#d6c6a8';if(/블루|청/.test(n))return '#2c4a72';if(/그린/.test(n))return '#4b6a55';if(/레드/.test(n))return '#a3182a';
  return '#c7ccd1';}
const TRIMS=['플래티넘','마스터즈','시그니처','노블레스','프레스티지','트렌디','X-Line','GT-Line','X-PRO','GT','그래비티','스마트셀렉션','베스트셀렉션','블랙에디션','아웃도어','익스트림','어드벤처','다이내믹','어스','에어','라이트','스탠다드','롱레인지','스마트','럭셔리','GLS','GL','L'];
const TINC=new Set(['플래티넘','마스터즈','X-Line','GT-Line','X-PRO','스마트셀렉션']);
function trimOf(t){t=t.replace(/베스트 셀렉션/g,'베스트셀렉션');const tk=t.split(/[\s_\-+]+/);for(const n of TRIMS){if(TINC.has(n)?t.includes(n):tk.includes(n))return n;}return '기타';}
const ekey=s=>(s||'').replace(/\s/g,'');
const EV_MODELS=new Set(['EV3','EV4','EV5','EV6','EV9']);
function fuel(t,m){if(EV_MODELS.has(m)||/EV 전기차|전기/.test(t))return '전기';if(/HEV|하이브리드/.test(t))return '하이브리드';if(/LPi|LPG/.test(t))return 'LPG';
  if(/디젤/.test(t))return '디젤';if(/가솔린|GSL|T\/GDI|GDI/.test(t))return '가솔린';return '기타';}
const won=n=>(n/10000).toLocaleString('ko-KR',{maximumFractionDigits:0});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const MODELS=new Set();const LIST_SYN={'할인':'sale','할인차량':'sale','할인차':'sale','할인재고':'sale','한정':'sale','한정재고':'sale','한정차량':'sale','즉시':'now','즉시출고':'now','즉출':'now','출고가능':'now','선배정':'pre','선배정차량':'pre'};const FUEL_SYN={'하이브리드':'하이브리드','hev':'하이브리드','하브':'하이브리드','hybrid':'하이브리드','전기':'전기','전기차':'전기','lpg':'LPG','lpi':'LPG','가솔린':'가솔린','휘발유':'가솔린','gsl':'가솔린','디젤':'디젤'};let DATA=null, view=[], shown=0;
const S={tab:'now',model:'',q:'',ext:'',fuel:'',trim:'',sort:'def'};
try{const s=JSON.parse(localStorage.getItem('bm_stock')||'{}');if(s.tab)S.tab=s.tab;}catch(e){}
const h=location.hash.slice(1);if(TAB_NAME[h])S.tab=h;
function save(){try{localStorage.setItem('bm_stock',JSON.stringify({tab:S.tab}));}catch(e){}}

const $=id=>document.getElementById(id);
function setTopH(){document.documentElement.style.setProperty('--toph',$('top').offsetHeight+'px');}
addEventListener('resize',setTopH);setTopH();

fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  DATA=d;
  for(const k of ['now','sale','pre']){
    d[k].forEach((x,i)=>{x._k=k;x._i=i;x._f=fuel(x.t,x.m);x._t=trimOf(x.t);x._s=(x.m+' '+x.t+' '+x.o+' '+x.e+' '+x.i+' '+(x.c||'')+' '+(x.no||'')+' '+(x.st||'')).toLowerCase().replace(/\s+/g,' ');});
    $('c-'+k).textContent=d[k].reduce((a,x)=>a+x.q,0).toLocaleString()+'대';
  }
  d.all=[...d.now,...d.sale,...d.pre];d.all.forEach(x=>{x._ml=x.m.toLowerCase();MODELS.add(x._ml);});d.all.forEach((x,i)=>{x._g=i;x._a=i;});
  $('c-all').textContent=d.all.reduce((a,x)=>a+x.q,0).toLocaleString()+'대';
  $('upd').textContent=d.updated;
  selectTab(S.tab,true);
}).catch(()=>{$('list').innerHTML='<div class="empty">재고 데이터를 불러오지 못했습니다.<br>잠시 후 새로고침 해주세요.</div>';});

function selectTab(k,keep){
  S.tab=k; if(!keep){S.model='';S.ext='';S.fuel='';S.trim='';}
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  if(location.hash.slice(1)!==k){try{history.replaceState(null,'','#'+k);}catch(e){location.hash=k;}}
  save(); buildModels(); buildSelects(); apply();
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)selectTab(b.dataset.k);});
addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(TAB_NAME[k]&&k!==S.tab)selectTab(k);});

function buildModels(){
  const cnt={},order=[];
  DATA[S.tab].forEach(x=>{if(!(x.m in cnt)){cnt[x.m]=0;order.push(x.m);}cnt[x.m]+=x.q;});
  const tot=Object.values(cnt).reduce((a,b)=>a+b,0);
  $('models').innerHTML=`<button class="chip ${S.model?'':'on'}" data-m="">전체<em>${tot}</em></button>`+
    order.map(m=>`<button class="chip ${S.model===m?'on':''}" data-m="${esc(m)}">${esc(m)}<em>${cnt[m]}</em></button>`).join('');
}
$('models').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;S.model=b.dataset.m;S.ext='';S.trim='';
  document.querySelectorAll('#models .chip').forEach(c=>c.classList.toggle('on',c===b));buildSelects();apply();});

function buildSelects(){
  const base=DATA[S.tab].filter(x=>!S.model||x.m===S.model);
  const ex={},fu={},tr={};
  base.forEach(x=>{const k=ekey(x.e);ex[k]=ex[k]||{n:x.e,c:0};ex[k].c+=x.q;fu[x._f]=(fu[x._f]||0)+x.q;tr[x._t]=(tr[x._t]||0)+x.q;});
  $('fTrim').innerHTML='<option value="">트림 전체</option>'+Object.entries(tr).sort((a,b)=>(a[0]==='기타')-(b[0]==='기타')||b[1]-a[1]).map(([k,v])=>`<option value="${esc(k)}" ${S.trim===k?'selected':''}>${esc(k)} (${v})</option>`).join('');
  $('fExt').innerHTML='<option value="">외장색상 전체</option>'+Object.entries(ex).sort((a,b)=>b[1].c-a[1].c)
    .map(([k,v])=>`<option value="${esc(k)}" ${S.ext===k?'selected':''}>${esc(v.n)} (${v.c})</option>`).join('');
  $('fFuel').innerHTML='<option value="">연료 전체</option>'+Object.entries(fu).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`<option ${S.fuel===k?'selected':''}>${k}</option>`).join('');
  const so=$('fSort');
  const hasSale=S.tab==='sale'||S.tab==='all';so.querySelector('[value=sd]').hidden=!hasSale;so.querySelector('[value=dd]').hidden=!hasSale;
  if(!hasSale&&(S.sort==='sd'||S.sort==='dd'))S.sort='def';so.value=S.sort;
}
$('fExt').onchange=e=>{S.ext=e.target.value;apply();};
$('fFuel').onchange=e=>{S.fuel=e.target.value;apply();};
$('fTrim').onchange=e=>{S.trim=e.target.value;apply();};
$('fSort').onchange=e=>{S.sort=e.target.value;apply();};
let tmr;$('q').addEventListener('input',e=>{clearTimeout(tmr);tmr=setTimeout(()=>{S.q=e.target.value;apply();},150);});
$('reset').onclick=()=>{S.model='';S.q='';S.ext='';S.fuel='';S.trim='';S.sort='def';$('q').value='';buildModels();buildSelects();apply();};

function apply(){
  const words=S.q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  view=(words.some(w=>LIST_SYN[w])?DATA.all:DATA[S.tab]).filter(x=>(!S.model||x.m===S.model)&&(!S.ext||ekey(x.e)===S.ext)&&(!S.fuel||x._f===S.fuel)&&(!S.trim||x._t===S.trim)&&
    words.every(w=>LIST_SYN[w]?x._k===LIST_SYN[w]:FUEL_SYN[w]?x._f===FUEL_SYN[w]:MODELS.has(w)?x._ml===w:(x._s.includes(w)||x._s.replace(/\s/g,'').includes(w))));
  const f={pa:(a,b)=>a.p-b.p,pd:(a,b)=>b.p-a.p,sd:(a,b)=>(b.s||0)-(a.s||0)||a.p-b.p,qd:(a,b)=>b.q-a.q,dd:(a,b)=>(a.d||'9').localeCompare(b.d||'9')}[S.sort];
  if(f)view.sort(f);else view.sort((a,b)=>S.tab==='all'?a._a-b._a:a._i-b._i);
  const n=view.reduce((a,x)=>a+x.q,0);
  const lk=words.map(w=>LIST_SYN[w]).find(Boolean);
  $('sum').innerHTML=`<span>${lk?TAB_NAME[lk]:TAB_NAME[S.tab]}${S.model?' · '+esc(S.model):''}</span><span><b>${n.toLocaleString()}</b>대 · ${view.length.toLocaleString()}개 사양</span>`;
  shown=0;$('list').innerHTML='';more();
}
function card(x){
  const opts=x.o==='무옵션'?'<span class="opt none">무옵션</span>':x.o.split(/[,&+]/).map(s=>s.trim()).filter(Boolean).map(o=>`<span class="opt">${esc(o)}</span>`).join('');
  let badge='',meta='';
  if(x._k==='sale'){
    if(x.s)badge+=`<span class="disc">할인 ${won(x.s)}만원</span>`;
    if(x.d)meta=`생산일 ${x.d===x.d2?x.d:x.d+' ~ '+x.d2}`;
  }
  if(x._k==='pre'){badge=`<span class="st ${x.st==='선점가능'?'ok':'wait'}">${esc(x.st)}</span>`;meta=`계약번호 ${esc(x.no)}`;}
  const qty=x.q>1?`<span class="qty">${x.q}대</span>`:'';
  return `<article class="card">
    <div class="r1">${(S.tab==='all'||x._k!==S.tab)?`<span class="src ${x._k}">${TAB_NAME[x._k]}</span>`:''}<span class="model">${esc(x.m)}</span><div class="trim">${esc(x.t)}</div>${qty}</div>
    ${x._k==='pre'&&x.c?`<div class="cust"><span>계약자</span><b>${esc(x.c)}</b></div>`:''}
    <div class="opts"><span class="ol">옵션</span>${opts}</div>
    <div class="colors"><span><i class="dot" style="background:${colorOf(x.e)}"></i>외장 ${esc(x.e)}</span><span><i class="dot" style="background:${colorOf(x.i)}"></i>내장 ${esc(x.i)}</span></div>
    <div class="r3"><div>${badge?'<div style="margin-bottom:4px">'+badge+'</div>':''}<div class="price">${won(x.p)}<small>만원</small></div>${meta?'<div class="meta">'+meta+'</div>':''}</div>
    <button class="ask" data-g="${x._g}">💬 문의</button></div>
  </article>`;
}
function more(){
  const next=view.slice(shown,shown+40);shown+=next.length;
  if(!view.length){$('list').innerHTML='<div class="empty">조건에 맞는 재고가 없습니다.<br>검색어나 필터를 바꿔보세요.</div>';}
  else $('list').insertAdjacentHTML('beforeend',next.map(card).join(''));
  $('more').hidden=shown>=view.length;$('more').textContent=`더 보기 (${(view.length-shown).toLocaleString()}개 남음)`;
}
$('more').onclick=more;
addEventListener('scroll',()=>$('totop').classList.toggle('show',scrollY>500),{passive:true});
$('totop').onclick=()=>scrollTo({top:0,behavior:'smooth'});
$('models').addEventListener('click',()=>{const y=$('sum').getBoundingClientRect().top+scrollY-$('top').offsetHeight-4;if(scrollY>y)scrollTo({top:y});});
if('IntersectionObserver' in window){new IntersectionObserver(es=>{if(es[0].isIntersecting&&!$('more').hidden)more();},{rootMargin:'400px'}).observe($('more'));}

$('list').addEventListener('click',e=>{const b=e.target.closest('.ask');if(!b)return;
  const x=DATA.all[+b.dataset.g];
  let t=`[재고문의 · ${TAB_NAME[x._k]}]\n차종: ${x.m} ${x.t}\n옵션: ${x.o}\n색상: ${x.e} / ${x.i}\n가격: ${won(x.p)}만원`;
  if(x._k==='sale'){if(x.s)t+=`\n할인: ${won(x.s)}만원`;if(x.d)t+=`\n생산일: ${x.d===x.d2?x.d:x.d+'~'+x.d2}`;}
  if(x._k==='pre')t+=`\n계약자: ${x.c}\n계약번호: ${x.no} (${x.st})`;
  t+=`\n(재고기준 ${DATA.updated})\n\n고객명: \n요청사항: 출고 가능한지 확인 부탁드립니다.`;
  $('msg').value=t;$('modal').classList.add('show');});
$('mClose').onclick=()=>$('modal').classList.remove('show');
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.remove('show');});
$('mCopy').onclick=async()=>{const t=$('msg').value;let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch(e){}
  if(!ok){try{$('msg').select();ok=document.execCommand('copy');}catch(e){}}
  toast(ok?'복사됐습니다. 카톡에 붙여넣기 해주세요 👍':'문구를 길게 눌러 직접 복사해주세요');
  if(ok)$('modal').classList.remove('show');};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

fetch('notice.json',{cache:'no-store'}).then(r=>r.json()).then(list=>{if(!list||!list.length)return;
  list.sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.date||'').localeCompare(a.date||''));
  const el=$('notice'),more=list.length>2;
  el.innerHTML=`<div class="nh" id="nhd">📢 공지사항 <small>${more?'전체 '+list.length+'건 보기 ▾':''}</small></div>`+
    list.map((n,i)=>`<div class="ni${i>=2?' old':''}"><div class="tt">${n.pin?'<span class="pin">필독</span>':''}<span>${esc(n.title)}</span><span class="dt">${esc((n.date||'').slice(5).replace('-','/'))}</span></div>${n.body?'<div class="bd">'+esc(n.body)+'</div>':''}</div>`).join('');
  el.hidden=false;
  const sig=list.map(n=>n.date+n.title+n.body).join('|');let h=0;for(const c of sig)h=(h*31+c.charCodeAt(0))|0;
  const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10),key='bm_np';let skip=false;
  try{const v=JSON.parse(localStorage.getItem(key)||'{}');skip=v.d===today&&v.h===h;}catch(e){}
  if(!skip){
    $('npbd').innerHTML=list.slice(0,5).map(n=>`<div class="npit"><div class="tt">${n.pin?'<span class="pin">필독</span>':''}<span>${esc(n.title)}</span><span class="dt">${esc((n.date||'').slice(5).replace('-','/'))}</span></div>${n.body?'<div class="bd">'+esc(n.body)+'</div>':''}</div>`).join('');
    $('npop').classList.add('show');
    const close=()=>$('npop').classList.remove('show');
    $('npClose').onclick=close;
    $('npToday').onclick=()=>{try{localStorage.setItem(key,JSON.stringify({d:today,h}));}catch(e){}close();};
    $('npop').addEventListener('click',e=>{if(e.target.id==='npop')close();});
  }
  if(more)$('nhd').onclick=()=>{el.classList.toggle('fold');$('nhd').querySelector('small').textContent=el.classList.contains('fold')?'전체 '+list.length+'건 보기 ▾':'접기 ▴';};
}).catch(()=>{});
let NP=null;
fetch('napgi.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{NP=d;$('nTitle').textContent=d.title;$('nSub').textContent=d.basis+' ›';$('nBasis').textContent=d.basis+' · '+d.notice;}).catch(()=>{$('nOpen').hidden=true;});
function nRender(){if(!NP)return;const q=$('nQ').value.trim().toLowerCase().replace(/\s/g,'');
  let h=q?'':'<div class="ncommon"><b>공통 안내</b><ul>'+NP.common.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul></div>';
  NP.groups.forEach(g=>{const rows=g.rows.filter(r=>!q||(r.m+r.k+g.name).toLowerCase().replace(/\s/g,'').includes(q));if(!rows.length)return;
    h+='<div class="ngrp">'+esc(g.name)+'</div>'+rows.map(r=>`<div class="nrow"><div class="l"><div class="m">${esc(r.m)}</div><div class="k">${esc(r.k)}</div>${r.n?'<div class="n">※ '+esc(r.n)+'</div>':''}</div><div class="d">${esc(r.d)}</div></div>`).join('')+(g.note&&!q?'<div class="ngnote">'+esc(g.note)+'</div>':'');});
  $('nBody').innerHTML=h||'<div class="empty">검색 결과가 없습니다.</div>';}
$('nOpen').onclick=()=>{nRender();$('nWrap').classList.add('show');document.body.style.overflow='hidden';};
function nClose(){$('nWrap').classList.remove('show');document.body.style.overflow='';}
$('nClose').onclick=nClose;$('nWrap').addEventListener('click',e=>{if(e.target.id==='nWrap')nClose();});
$('nQ').addEventListener('input',nRender);
})();
</script>
</body>
</html>
